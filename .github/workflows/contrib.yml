# The helpers under contrib/: each is its own project, with its own dependencies, so each
# gets linted and tested on its own.

name: contrib

on:
  push:
    branches: [main]
    paths: ["contrib/**", ".github/workflows/contrib.yml"]
  pull_request:
    paths: ["contrib/**", ".github/workflows/contrib.yml"]

permissions:
  contents: read

jobs:
  aws_s3:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contrib/aws_s3
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest -q
