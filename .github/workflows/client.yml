# The JavaScript client: test it, build it, and keep the built files somewhere a task
# author can download them without installing anything.
#
# Every push and pull request that touches the client runs its tests and builds it; the
# built files are attached to the run as an artifact called "pig-client". Pushing a tag
# like v0.3.0 (`just release` makes and pushes it) also attaches them to a GitHub release of that name, and publishes
# that version to npm.
#
# Publishing uses npm's trusted publishing, so there's no npm token stored here. It has to
# be turned on once, on npmjs.com, in the package's settings: trusted publisher GitHub
# Actions, repository uwmadison-chm/psych-ingestor, workflow client.yml. npm only allows
# that for a package that already exists, so the very first version is published by hand.

name: client

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["client/**", "src/**", "pyproject.toml", ".github/workflows/client.yml"]
  pull_request:
    paths: ["client/**", "src/**", "pyproject.toml", ".github/workflows/client.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: client

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      # The browser tests run against a real `pig serve`.
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
        working-directory: .

      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

      - uses: actions/upload-artifact@v4
        with:
          name: pig-client
          path: |
            client/dist/pig.js
            client/dist/pig.script.js
            client/dist/pig-worker.js

  # After publish, so a tag that doesn't match package.json makes no release either.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test-and-build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pig-client
          path: pig-client
      - uses: softprops/action-gh-release@v2
        with:
          files: pig-client/*
          prerelease: ${{ contains(github.ref_name, '-') }}

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # what trusted publishing signs in with
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or later; Node 22 comes with npm 10.
      - run: npm install -g npm@11.6.2

      - name: The tag matches package.json
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "The tag is ${GITHUB_REF_NAME}, but package.json says ${version}."
            exit 1
          fi

      - run: npm ci

      # A version like 1.0.0-pre.1 is a prerelease. npm won't publish one without a tag,
      # and giving it `next` means a plain `npm install` still gets the latest release.
      - name: npm publish
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            npm publish --tag next
          else
            npm publish
          fi
