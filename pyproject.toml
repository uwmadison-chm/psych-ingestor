[project]
name = "psych-ingestor"
version = "1.0.0-pre.2"
description = "An HTTP API for ingesting, routing, and storing data from online behavioral-research tasks"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=44",
    "cyclopts>=3.0",
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pyrage>=1.2",
    "uvicorn>=0.32",
]

[project.scripts]
pig = "psych_ingestor.cli:main"
pigsty = "psych_ingestor.sty_cli:main"

[build-system]
requires = ["uv_build>=0.11.22,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.9.1",
    "pytest>=8.3",
    "ruff>=0.16.0",
    "rust-just>=1.57.0",
    "ty>=0.0.63",
]

[tool.ty.environment]
# Stubs for pyrage, which ships none.
extra-paths = ["typings"]

[tool.pytest.ini_options]
# contrib/ holds separate projects with their own tests and dependencies.
testpaths = ["tests"]
