[project]
name = "psych-ingestor"
version = "0.1.0"
description = "An HTTP API for ingesting, routing, and storing data from online behavioral-research tasks"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
pig = "psych_ingestor:main"

[build-system]
requires = ["uv_build>=0.11.22,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.0",
    "rust-just>=1.57.0",
    "ty>=0.0.63",
]
