# An example secure-side configuration. Copy it to local/pigsty.toml and edit.
#
# pig.toml is for the web server and read by `pig`; this file is for the machine where
# the data ends up and read by `pigsty`. No command reads both. In production, keep them
# on different machines. See docs/organizing.md.
#
# Paths are relative to this file. A task not listed here is never admitted or
# organized: pigsty only works on the tasks it's told about.

# Where Pig's web server is, for pigsty purge.
pig_url = "http://127.0.0.1:8000"

# The private keys encrypted runs are decrypted with and links are signed with, one .key
# file each. Only needed once a task encrypts or checks signatures: uncomment it, and
# make a key with `pigsty keys new lucida/2026a` or
# `pigsty keys new --signing lucida/signing`. See docs/organizing.md.
# private_keys_dir = "./private_keys"

# The user every pigsty command has to run as, so nothing it makes belongs to someone
# else. Unset, anyone can run it. See docs/configuration.md.
#
# run_as = "pigsty"

# pigsty refuses a private key file anyone but its owner can read. On a filesystem that
# reports permissions it doesn't enforce, like some network shares, every file looks
# that way; set this to read them anyway. Keeping the keys private is then up to the
# filesystem's own access controls. See docs/organizing.md.
#
# ignore_permissions = true

[task.stroop]
# Where this task's runs are kept. Runs copied from the bucket arrive in incoming/, and
# pigsty admit puts them in runs/ once they check out.
datastore_base = "./stroop-data"
# Where pigsty organize puts each run. Everything before the first placeholder is a
# directory of this task's own; the rest is filled in from each run. Placeholders are
# {task_code}, {run_number}, and any of the task's path_parameters in pig.toml. It has
# to include {run_number}.
organized = "./organized/stroop/{session}/{participant_id}_{run_number}"
# For a task that checks signatures: the parameters pigsty sign signs, the same list as
# the task's signed_parameters in pig.toml.
# signed_parameters = ["participant_id", "session"]
